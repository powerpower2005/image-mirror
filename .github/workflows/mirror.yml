name: 이미지 미러링

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mirror
  cancel-in-progress: false

jobs:
  mirror:
    name: 새 이미지 확인 및 복사
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      PYTHONUTF8: '1'
    steps:
      - name: 저장소 가져오기
        id: checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: 파이썬 준비
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.12'

      - name: 의존성 설치
        run: python -m pip install --disable-pip-version-check 'PyYAML==6.0.3'

      - name: 자동 테스트
        run: python -m unittest discover -s tests -v

      - name: 이미지 복사 도구 설치
        shell: bash
        env:
          CRANE_VERSION: v0.22.1
          CRANE_SHA256: 0ab7a1d6932a213aed964ce97666c3077fe691c8606413674a8b3e0b9ec4cda0
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/go-containerregistry.tar.gz"
          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/google/go-containerregistry/releases/download/${CRANE_VERSION}/go-containerregistry_Linux_x86_64.tar.gz" \
            --output "$archive"
          printf '%s  %s\n' "$CRANE_SHA256" "$archive" | sha256sum --check --status
          mkdir -p "$RUNNER_TEMP/image-mirror-bin"
          tar -xzf "$archive" -C "$RUNNER_TEMP/image-mirror-bin" crane
          echo "$RUNNER_TEMP/image-mirror-bin" >> "$GITHUB_PATH"
          echo '이미지 복사 도구 설치와 파일 검증을 완료했습니다.'

      - name: Docker Hub 로그인
        shell: bash
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/image-mirror-auth
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "$DOCKERHUB_USERNAME" || -z "$DOCKERHUB_TOKEN" ]]; then
            echo '::error::Docker Hub 비밀 설정 두 개를 등록해 주세요.'
            exit 1
          fi
          mkdir -p "$DOCKER_CONFIG"
          chmod 700 "$DOCKER_CONFIG"
          if ! printf '%s' "$DOCKERHUB_TOKEN" | crane auth login index.docker.io \
            --username "$DOCKERHUB_USERNAME" --password-stdin > /dev/null 2>&1; then
            echo '::error::Docker Hub 로그인에 실패했습니다. 계정과 토큰을 확인해 주세요.'
            exit 1
          fi
          echo 'Docker Hub 로그인을 완료했습니다.'

      - name: 새 태그 확인 및 미러링
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/image-mirror-auth
          DOCKERHUB_NAMESPACE: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: python scripts/mirror.py

      - name: 상태 변경 저장
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898081+github-actions[bot]@users.noreply.github.com'
          git add -- state/images.json README.md
          if git diff --cached --quiet; then
            echo '저장할 상태 변경이 없습니다.'
            exit 0
          fi
          git commit -m '이미지 감시 상태 및 미러링 기록 갱신'
          for attempt in 1 2 3; do
            if git push origin "HEAD:$DEFAULT_BRANCH"; then
              echo '상태 변경을 저장했습니다.'
              exit 0
            fi
            git fetch origin "$DEFAULT_BRANCH"
            if ! git rebase "origin/$DEFAULT_BRANCH"; then
              git rebase --abort
              echo '::error::상태 저장 중 충돌했습니다. 강제 업로드하지 않습니다.'
              exit 1
            fi
          done
          echo '::error::상태 변경을 원격 저장소에 올리지 못했습니다.'
          exit 1

      - name: 임시 인증정보 삭제
        if: ${{ always() }}
        shell: bash
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/image-mirror-auth
        run: |
          set -euo pipefail
          rm -f -- "$DOCKER_CONFIG/config.json"
          rmdir -- "$DOCKER_CONFIG" 2>/dev/null || true
